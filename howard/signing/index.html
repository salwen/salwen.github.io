<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簽約中心｜Howard Lo</title>
<link rel="stylesheet" href="../homestyler/case.css">
<link rel="stylesheet" href="signing.css">
<script src="photos.js" defer></script>
<script src="../homestyler/gallery.js" defer></script>
</head>
<body>
<header class="wrap top">
  <a href="../index.html#work">← 返回作品集</a>
</header>
<main>
  <section class="intro">
    <div>
      <p class="label">信義代書 · 空間策略</p>
      <h1>簽約中心</h1>
      <p class="hero-line">把信任，落實在每個服務細節。</p>
      <a href="#screen-heading">走進簽約中心 ↓</a>
    </div>
  </section>

  <section class="wrap overview" aria-labelledby="overview-title">
    <div>
      <h2 id="overview-title">從抵達到簽署</h2>
      <p>客戶走進簽約中心，需要知道往哪裡走、在哪裡等候，以及何時能在私密的空間裡談交易。從品牌牆、等候座位到簽約室門牌，每一段動線都對應一個具體的服務需求。</p>
      <p>Howard 負責服務動線、空間規格及跨據點整合，與代書使用單位、空間設計、工程及設備團隊協作。</p>
    </div>
    <figure>
      <img src="photos/18245087.jpg" alt="陽光照進信義代書簽約中心，品牌牆與窗邊座位分列兩側" loading="lazy">
      <figcaption>入口品牌牆與沿窗接待空間</figcaption>
    </figure>
  </section>

  <div class="wrap chapter-nav">
    <h2 id="screen-heading">沿著服務動線看現場</h2>
    <div class="chapter-controls">
      <button type="button" data-slide="-1" aria-label="向左瀏覽章節">←</button>
      <button type="button" data-slide="1" aria-label="向右瀏覽章節">→</button>
    </div>
  </div>
  <nav id="screens" aria-labelledby="screen-heading" tabindex="0"></nav>

  <div class="wrap">
    <div id="chapters"></div>
    <section id="planning" aria-labelledby="planning-title">
      <h2 id="planning-title">從空間規劃到工程</h2>
      <p>內湖案以迎賓、自由洽談、休憩、簽約、辦公與金庫收納分區，並將家具、照明、材料及空間識別納入規格。跨據點整合沿用共同的服務原則，各案再依場址格局和工程條件調整。</p>
    </section>
    <footer><a href="../index.html#work">← 返回作品集</a></footer>
  </div>
</main>
<dialog aria-labelledby="image-label">
  <div class="viewer-bar"><span id="image-label" aria-live="polite"></span><button id="close" type="button">關閉 ×</button></div>
  <div class="stage" tabindex="0" aria-label="現場照片，可捲動查看直幅照片"><img id="full" alt=""></div>
  <div class="controls"><button id="prev" type="button" aria-label="上一張">←</button><div class="strip" aria-label="現場照片縮圖"></div><button id="next" type="button" aria-label="下一張">→</button></div>
</dialog>
</body>
</html>
